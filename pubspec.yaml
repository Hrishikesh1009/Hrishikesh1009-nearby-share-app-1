name: nearby_share
description: >
  Zero-cloud, AirDrop-like local file sharing. Discovers peers over
  Wi-Fi Direct / Multipeer Connectivity, mDNS on the local Wi-Fi router
  network, and Bluetooth LE (handshake only), then streams files over an
  encrypted raw TCP socket in resumable 4MB chunks.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter

  # State management: a single ChangeNotifier (NearbyShareEngine) exposed via
  # Provider is the seam between network services and UI state.
  provider: ^6.1.2

  # Layer 1 — real Wi-Fi Direct on Android (WifiP2pManager under the
  # hood), actively maintained. No iOS equivalent — Apple doesn't expose
  # peer-to-peer Wi-Fi Direct/Multipeer Connectivity the same way, and
  # this package is Android-only; see
  # core/discovery/nearby_discovery_service.dart for how that's handled.
  flutter_p2p_connection: ^3.0.3

  # Layer 2 — mDNS / Bonjour discovery + advertisement on the local Wi-Fi
  # router network (zero-configuration).
  bonsoir: ^7.1.5

  # Layer 3 — Bluetooth LE for discovery/handshake only, never for the file
  # stream itself.
  flutter_blue_plus: ^2.3.12

  # ECDH (X25519) + AEAD (AES-256-GCM) for the encrypted socket handshake
  # and per-frame encryption.
  cryptography: ^2.9.0

  # Streaming SHA-256 for the pre-transfer file manifest hash and the
  # post-transfer integrity check.
  crypto: ^3.0.7
  convert: ^3.1.2

  # Capped by flutter_p2p_connection's own dependency constraint
  # (permission_handler ^11.3.1); nothing in this app needs a newer one.
  permission_handler: ^11.3.1
  path_provider: ^2.1.6
  uuid: ^4.6.0
  file_picker: ^12.1.3

  # WiFi tab: real SSID + a scannable "join this network" QR.
  network_info_plus: ^8.2.1
  qr_flutter: ^4.1.0

  # Settings tab: device name + feature toggles, and the local BLE
  # "paired via this app" list on the Bluetooth tab.
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
